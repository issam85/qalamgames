<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sterrensprong — spel van Al Qalam Gouda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div class="hud">
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="hud-row"><span id="percent">0%</span><span id="attempt">Poging 1</span></div>
  </div>
  <button id="to-menu" class="pill" type="button">Kleuren</button>
  <div id="toast"></div>
  <div id="flash"></div>
  <div id="overlay" class="overlay" hidden>
    <h1 id="overlay-title"></h1>
    <p id="overlay-text"></p>
  </div>
  <section id="menu" class="menu" hidden>
    <h1>Sterrensprong</h1>
    <div class="menu-scroll">
      <h2>Kleurencombinaties</h2>
      <div id="combos" class="swatches"></div>
      <h2>Of kies zelf: licht</h2>
      <div id="bodies" class="swatches"></div>
      <h2>Dak en rand</h2>
      <div id="metals" class="swatches"></div>
    </div>
    <button id="start" class="start" type="button">Start</button>
  </section>
  <script type="module" src="game.js"></script>
</body>
</html>
