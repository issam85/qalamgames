<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Zoek Schelp Kristal — spel van Al Qalam Gouda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="start.css">
  <link rel="stylesheet" href="kleed.css">
  <link rel="stylesheet" href="kleed-phone.css">
  <link rel="stylesheet" href="strand.css">
  <link rel="stylesheet" href="douche.css">
</head>
<body>
  <section id="screen-start" class="screen active">
    <header class="bar">
      <h1>Zoek Schelp Kristal</h1>
      <div class="found"><span class="ico shell" aria-hidden="true"></span><b class="shells">0</b><span class="ico crystal" aria-hidden="true"></span><b class="crystals">0</b></div>
    </header>
    <div class="start">
      <div class="start-stage"><div id="start-doll" class="doll"></div></div>
      <div class="start-panel">
        <h2>Kies je prinses</h2>
        <div id="start-pick" class="pick"></div>
        <div class="start-buttons">
          <button id="to-strand" class="btn blue">Naar het strand</button>
          <button id="to-douche" class="btn blue">Douchen</button>
          <button id="to-kleed" class="btn green">Kleedhokje</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-kleed" class="screen">
    <header class="bar">
      <button class="pill back">Terug</button>
      <h1>Kleedhokje</h1>
      <div class="found"><span class="ico shell" aria-hidden="true"></span><b class="shells">0</b><span class="ico crystal" aria-hidden="true"></span><b class="crystals">0</b></div>
    </header>
    <div class="kleed">
      <nav id="kleed-cats" class="cats" aria-label="Soort"></nav>
      <div class="kleed-stage"><div id="kleed-doll" class="doll"></div></div>
      <div class="kleed-panel">
        <h2 id="kleed-title"></h2>
        <div id="kleed-items" class="items"></div>
        <div id="kleed-swatches" class="swatches" aria-label="Kleur"></div>
        <div class="kleed-buttons">
          <button id="kleed-surprise" class="btn gold">Verras me!</button>
          <button id="kleed-done" class="btn green">Klaar!</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-strand" class="screen">
    <header class="bar">
      <button class="pill back">Terug</button>
      <p id="strand-progress" class="hunt"></p>
      <div class="found"><span class="ico shell" aria-hidden="true"></span><b class="shells">0</b><span class="ico crystal" aria-hidden="true"></span><b class="crystals">0</b></div>
    </header>
    <div class="strand">
      <canvas id="strand-canvas" width="960" height="540" aria-label="Het strand in het donker"></canvas>
      <p class="strand-hint">Loop met de pijltjes, of houd je vinger waar de prinses heen moet. Zoek de schelpen en kristallen die glinsteren!</p>
      <div id="strand-end" class="strand-end" hidden>
        <h2>Alles gevonden!</h2>
        <p>Je hebt alle schelpen en kristallen van vanavond.</p>
        <div class="strand-buttons">
          <button id="strand-again" class="btn gold">Nog een keer</button>
          <button class="btn green back">Terug</button>
        </div>
      </div>
    </div>
  </section>

  <section id="screen-douche" class="screen">
    <header class="bar">
      <button class="pill back">Terug</button>
      <h1>Stranddouche</h1>
      <div class="found"><span class="ico shell" aria-hidden="true"></span><b class="shells">0</b><span class="ico crystal" aria-hidden="true"></span><b class="crystals">0</b></div>
    </header>
    <div class="kleed">
      <nav id="douche-tools" class="cats" aria-label="Spullen bij de douche"></nav>
      <div class="kleed-stage"><div id="douche-stage" class="doll douche-stage"></div></div>
      <div class="kleed-panel">
        <div class="meter-row"><h2>Schoon</h2><span id="douche-label"></span></div>
        <div class="meter"><div id="douche-meter"></div></div>
        <p id="douche-hint" class="hint"></p>
        <div class="kleed-buttons">
          <button id="douche-reset" class="btn blue">Opnieuw</button>
          <button id="douche-done" class="btn green">Naar het kleedhokje</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
