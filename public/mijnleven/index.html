<body>
  <section id="screen-huis" class="screen active">
    <header class="bar">
      <h1>Mijn Leven</h1>
      <div class="stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span class="stars-count">0</span> sterren</div>
    </header>
    <div class="huis">
      <div class="huis-me">
        <div id="huis-doll" class="doll"></div>
        <p>Dit ben jij! Kies een kamer.</p>
      </div>
      <div class="rooms">
        <button class="room is-open" data-room="bad"><b>Badkamer</b><span>Douchen, tanden poetsen en make-up</span></button>
        <button class="room is-open" data-room="kast"><b>Kledingkast</b><span>Hoofddoeken, jurken, schoenen, tassen en sieraden</span></button>
        <button class="room is-open" data-room="kapper"><b>Kapper</b><span>Borstelen, kammen, knippen, vlechten en mooie kapsels</span></button>
        <button class="room is-open" data-room="keuken"><b>Keuken</b><span>Pannenkoeken, couscous en soep koken</span></button>
        <button class="room is-open" data-room="gezin"><b>Gezin</b><span>Eten geven, spelen, voorlezen en naar bed</span></button>
        <button class="room is-open" data-room="moskee"><b>Moskee en Mekka</b><span>Wudu, de vijf gebeden en de reis naar Mekka</span></button>
        <button class="room is-open" data-room="slaap"><b>Slaapkamer</b><span>Pyjama, muziekdoosje en slapen</span></button>
        <button class="room is-open" data-room="winkel"><b>Winkel</b><span>Kleren, make-up en haarspullen kopen met je sterren</span></button>
      </div>
    </div>
  </section>

  <section id="screen-kast" class="screen">
    <header class="bar">
      <button class="pill home">Huis</button>
      <h1>Kledingkast</h1>
      <div class="stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.5 5.7 21l1.5-7L2 9.3l7-.8z"/></svg><span class="stars-count">0</span> sterren</div>
    </header>
    <div class="kast">
      <nav id="kast-cats" class="cats" aria-label="Soort kleding"></nav>
      <div class="kast-stage"><div id="kast-doll" class="doll"></div></div>
      <div class="kast-panel">
        <h2 id="kast-title"></h2>
        <div id="kast-items" class="items"></div>
        <div id="kast-swatches" class="swatches" aria-label="Kleur"></div>
        <div class="kast-buttons">
          <button id="kast-surprise" class="btn gold">Verras me!</button>
          <button id="kast-photo" class="btn blue">Foto</button>
          <button id="kast-done" class="btn green">Klaar!</button>
        </div>
      </div>
    </div>
  </section>

  <div id="photo" class="overlay" hidden>
    <div class="photo-card">
      <img id="photo-img" alt="Foto van jouw outfit">
      <div class="photo-actions">
        <a id="photo-save" class="btn green" download="mijn-outfit.png">Opslaan</a>
        <button id="photo-close" class="btn blue">Terug</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
