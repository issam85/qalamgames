<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Geen internet — Qalam Games</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      padding: 24px; box-sizing: border-box; text-align: center;
      font-family: system-ui, sans-serif; color: #fff;
      background: radial-gradient(circle at 50% 30%, #8ee0ff, #35a7f0 45%, #1565c0);
    }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 0; font-size: 28px; color: #ffd43b; text-shadow: 0 3px 0 #c62828; }
    p { margin: 0; font-size: 18px; max-width: 420px; }
    button {
      padding: 12px 28px; border: 0; border-radius: 16px; font-size: 20px; font-weight: 700;
      color: #fff; background: #2e7d32; box-shadow: 0 5px 0 #1b5e20; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="">
  <h1>Geen internet</h1>
  <p>De spellen van Qalam Games werken alleen met internet. Zet de wifi aan en probeer het opnieuw.</p>
  <button type="button" onclick="location.reload()">Opnieuw proberen</button>
</body>
</html>
